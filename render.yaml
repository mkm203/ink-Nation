# Render Blueprint for the Ink Nation app (free plan).
# The whole Express app is hosted here (the API and the website). The data lives in a free
# Turso database, because Render's free plan erases its own files on every deploy and restart.
#
# 1. Create the free Turso database (DEPLOY.md, step 1).
# 2. Push this folder to GitHub.
# 3. On Render: New + > Blueprint, choose the repository, apply.
# 4. Fill in the values marked "sync: false" in the dashboard (TURSO_*, passwords, email...).
# See DEPLOY.md for the full walkthrough, including the paid-disk alternative.
services:
  - type: web
    name: ink-nation
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Everything durable (content, bookings, orders, photos, video) lives in Turso.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SLOTS_PER_ARTIST_PER_DAY
        value: "2"
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: APP_URL
        sync: false
      # Email: the free plan blocks SMTP, so use Brevo's web API (DEPLOY.md, step 4).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
